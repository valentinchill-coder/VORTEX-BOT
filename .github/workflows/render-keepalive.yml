name: Keep VORTEX-BOT awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: vortex-render-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://vortex-bot-umtr.onrender.com/healthz"
          echo "Checking $URL"
          response="$(curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 45 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$URL")"
          if [[ "$response" != "VORTEX BOT is running" ]]; then
            echo "::error::Unexpected health response: $response"
            exit 1
          fi
          echo "Health check passed: $response"
