name: Keep VORTEX-BOT awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: |
          set -euo pipefail
          URL="https://vortex-bot-umtr.onrender.com/healthz"
          echo "Checking $URL"
          curl --fail --silent --show-error --location --max-time 90 "$URL"
          echo
          echo "VORTEX-BOT health endpoint returned HTTP success."
